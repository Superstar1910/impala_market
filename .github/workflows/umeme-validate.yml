name: Validate Umeme research model
on:
  push:
    paths: ['coverage/umeme/**']
  pull_request:
    paths: ['coverage/umeme/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coverage/umeme
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python models/recovery.py data/assumptions/illustrative.json
